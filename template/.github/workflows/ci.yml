name: Chromium Extension CI
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/node-ci.yml@a3a3790db090a416409edf543e781652b686c1fb
    with:
      node-version: '22'
      package-manager: pnpm
      build-command: |
        corepack pnpm build
        corepack pnpm verify:build
        corepack pnpm exec playwright install --with-deps chromium
        corepack pnpm exec playwright test
        node scripts/report-size.mjs
        corepack pnpm run doctor
      artifact-path: dist/
      artifact-name: chromium-extension

      diagnostics-path: |
        reports/screenshots/
        reports/bundle-size.json
        reports/diagnostics.json
        reports/doctor.json
        test-results/
        playwright-report/
      diagnostics-name: chromium-diagnostics
