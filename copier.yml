_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

project_name:
  type: str
  default: My Chromium Extension
  help: Human-readable extension name (1–75 characters)
  validator: >-
    {% if not project_name | trim or project_name | length > 75 or '\n' in project_name or '\r' in project_name %}
    Use a single-line name of 1–75 characters.
    {% endif %}

project_slug:
  type: str
  default: "{% set ns = namespace(slug='') %}{% for c in project_name | lower %}{% if c in 'abcdefghijklmnopqrstuvwxyz0123456789' %}{% set ns.slug = ns.slug ~ c %}{% elif ns.slug and not ns.slug.endswith('-') %}{% set ns.slug = ns.slug ~ '-' %}{% endif %}{% endfor %}{{ ns.slug.rstrip('-') or 'my-extension' }}"
  help: npm package name (lowercase letters, digits, and single hyphens)
  validator: >-
    {% if not project_slug or project_slug | length > 75 or project_slug[0] == '-' or project_slug[-1] == '-' or '--' in project_slug or project_slug in ['node_modules', 'favicon.ico'] or project_slug | reject('in', 'abcdefghijklmnopqrstuvwxyz0123456789-') | list %}
    Use 1–75 lowercase ASCII letters, digits, and single separating hyphens.
    {% endif %}

project_description:
  type: str
  default: Lightweight, responsive Chromium extension
  validator: >-
    {% if not project_description | trim or project_description | length > 132 or '\n' in project_description or '\r' in project_description %}
    Use a single-line description of 1–132 characters.
    {% endif %}

include_popup:
  type: bool
  default: true

include_sidebar:
  type: bool
  default: true

include_settings:
  type: bool
  default: true

include_page_context_menu:
  type: bool
  default: true

include_toolbar_context_menu:
  type: bool
  default: true

include_keyboard_shortcuts:
  type: bool
  default: false
  help: Include a shortcut to save the active page.

include_toolbar_badge:
  type: bool
  default: false
  help: Display the saved-link count on the toolbar icon.

include_optional_permissions:
  type: bool
  default: false
  help: Include a runtime notification-permission grant/revoke example (UI requires settings).

include_content_script:
  type: bool
  default: false
  help: Include an isolated content script restricted to https://example.com/*.

include_example:
  type: bool
  default: false
  help: Include saved-link demonstration and its product-specific tests.

_exclude:
  - "{% if not include_example %}src/example/**{% endif %}"
  - "{% if not include_example %}tests/unit/items.test.ts{% endif %}"
  - "{% if not include_example %}tests/unit/commands.test.ts{% endif %}"
  - "{% if not include_example %}tests/e2e/extension.spec.ts{% endif %}"
  - "{% if not include_example %}tests/e2e/capabilities.spec.ts{% endif %}"
  - "{% if not include_example %}tests/e2e/states.spec.ts{% endif %}"
