name: Storage schema validation
on:
  push:
    branches: [remove-legacy-storage-keys]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
      - name: Format and check generated project
        run: |
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm fix
          pnpm check
          pnpm build
          pnpm verify:build
      - name: Test new storage schema in Chromium
        run: |
          cd "$RUNNER_TEMP/extension"
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
          test "$(find reports/screenshots -name '*.png' | wc -l)" -eq 6
      - name: Sync normalized source
        run: |
          cp -r "$RUNNER_TEMP/extension/src/." template/src/
          cp -r "$RUNNER_TEMP/extension/tests/." template/tests/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template/src template/tests
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize storage schema formatting'
            git push
          fi
