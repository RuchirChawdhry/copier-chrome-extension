name: Refresh screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/screenshots.yml']

permissions:
  contents: read

concurrency:
  group: repository-screenshots
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: clean
            example: 'false'
          - profile: demo
            example: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Generate fully enabled extension
        env:
          INCLUDE_EXAMPLE: ${{ matrix.example }}
        run: |
          python -m pip install copier==9.14.1
          copier copy --defaults --vcs-ref=HEAD \
            -d project_name="Chromium Extension" \
            -d include_example="$INCLUDE_EXAMPLE" \
            -d include_keyboard_shortcuts=true \
            -d include_toolbar_badge=true \
            -d include_optional_permissions=true \
            -d include_content_script=true \
            . "$RUNNER_TEMP/extension"
      - name: Install and capture extension pages
        run: |
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm check
          pnpm build
          pnpm verify:build
          cp "$GITHUB_WORKSPACE/tests/ui-design.spec.ts" tests/e2e/ui-design.spec.ts
          pnpm exec playwright test screenshots.spec.ts ui-design.spec.ts
      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screenshots-${{ matrix.profile }}
          path: ${{ runner.temp }}/extension/reports/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: screenshot-diagnostics-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/extension/reports/diagnostics.json
            ${{ runner.temp }}/extension/test-results/
            ${{ runner.temp }}/extension/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Download and verify complete screenshot set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for profile in clean demo; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "screenshots-$profile" --dir "$RUNNER_TEMP/captures/$profile"
          done
          python - "$RUNNER_TEMP/captures" <<'PY'
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          sizes = {"popup": (360, 400), "sidebar": (360, 720),
                   "settings": (900, 700), "settings-browser": (900, 700)}
          expected = {f"{surface}-{theme}.png": size
                      for surface, size in sizes.items()
                      for theme in ("light", "dark")}
          for profile in ("clean", "demo"):
              files = list((root / profile).iterdir())
              assert {p.name for p in files} == expected.keys(), f"Incomplete capture: {profile}"
              for path in files:
                  data = path.read_bytes()
                  assert data[:8] == b"\x89PNG\r\n\x1a\n" and data[12:16] == b"IHDR", path
                  assert struct.unpack(">II", data[16:24]) == expected[path.name], path
          print("Verified all 16 PNG screenshots and dimensions")
          PY
      - name: Replace repository screenshots
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "main changed during capture; rerun against the latest revision." >&2
            exit 1
          fi
          rm -rf screenshots
          mkdir screenshots
          cp -R "$RUNNER_TEMP/captures/." screenshots/
          git add -A -- screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh extension screenshots"
          git push origin HEAD:main
          echo "Published 16 screenshots to screenshots/ (clean and demo)." >> "$GITHUB_STEP_SUMMARY"
