name: UI refactor validation
on:
  push:
    branches: [ui-design-system]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier==9.14.1
      - name: Generate both profiles
        run: |
          for profile in clean demo; do
            example=false
            if [[ "$profile" == demo ]]; then example=true; fi
            copier copy --defaults --vcs-ref=HEAD -d include_example="$example" -d include_keyboard_shortcuts=true -d include_toolbar_badge=true -d include_optional_permissions=true -d include_content_script=true . "$RUNNER_TEMP/$profile"
          done
      - name: Normalize and validate both profiles
        run: |
          corepack enable
          for profile in clean demo; do
            cd "$RUNNER_TEMP/$profile"
            if [[ "$profile" == clean ]]; then
              pnpm install --no-frozen-lockfile
              cp pnpm-lock.yaml "$GITHUB_WORKSPACE/template/pnpm-lock.yaml"
            else
              cp "$GITHUB_WORKSPACE/template/pnpm-lock.yaml" .
              pnpm install --frozen-lockfile
            fi
            pnpm exec biome check --write --max-diagnostics=100 .
            pnpm check
            pnpm build
            pnpm verify:build
            pnpm exec playwright install --with-deps chromium
            pnpm exec playwright test
            test "$(find reports/screenshots -name '*.png' | wc -l)" -eq 8
            node scripts/report-size.mjs
            pnpm test:reload
            cd "$GITHUB_WORKSPACE"
          done
      - name: Synchronize formatted source and lockfile
        run: |
          python tests/normalize_ui.py "$RUNNER_TEMP/clean" "$RUNNER_TEMP/demo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template
          git diff --cached --quiet || git commit -m 'Normalize Tailwind UI and lock dependencies'
          git push
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-refactor-diagnostics
          path: |
            ${{ runner.temp }}/clean/reports/
            ${{ runner.temp }}/demo/reports/
            ${{ runner.temp }}/clean/test-results/
            ${{ runner.temp }}/demo/test-results/
          if-no-files-found: ignore
