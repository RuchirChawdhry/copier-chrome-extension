name: Diagnostic failure probe (intentional failure)
on:
  push:
    branches: [phase-2-productivity]
permissions:
  contents: read
jobs:
  probe:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/node-ci.yml@a3a3790db090a416409edf543e781652b686c1fb
    with:
      project-path: .validation/generated
      node-version: '22'
      package-manager: pnpm
      typecheck-command: ''
      lint-command: ''
      test-command: ''
      build-command: |
        corepack pnpm build
        corepack pnpm exec playwright install --with-deps chromium
        cp ../diagnostics-probe.ts tests/e2e/diagnostics-probe.spec.ts
        corepack pnpm exec playwright test diagnostics-probe.spec.ts
      diagnostics-path: |
        .validation/generated/test-results/
        .validation/generated/playwright-report/
      diagnostics-name: intentional-failure-diagnostics
