name: Phase 2 validation
on:
  push:
    branches: [phase-2-productivity]

permissions:
  contents: read

jobs:
  validate:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/node-ci.yml@a3a3790db090a416409edf543e781652b686c1fb
    with:
      project-path: .validation/generated
      node-version: '22'
      package-manager: pnpm
      build-command: |
        corepack pnpm build
        corepack pnpm verify:build
        corepack pnpm exec playwright install --with-deps chromium
        corepack pnpm exec playwright test
      artifact-path: .validation/generated/dist/
      artifact-name: chromium-extension

      diagnostics-path: |
        .validation/generated/reports/screenshots/
        .validation/generated/test-results/
        .validation/generated/playwright-report/
      diagnostics-name: chromium-diagnostics
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python -m pip install copier
      - run: python -m unittest discover -s tests
  regression:
    strategy:
      fail-fast: false
      matrix:
        check: [features, reload, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
      - name: Install Chromium
        if: matrix.check != 'setup'
        run: cd "$RUNNER_TEMP/extension" && pnpm exec playwright install --with-deps chromium
      - name: Verify feature combinations
        if: matrix.check == 'features'
        run: cd "$RUNNER_TEMP/extension" && node "$GITHUB_WORKSPACE/tests/validate_features.mjs"
      - name: Verify full reload cycle
        if: matrix.check == 'reload'
        run: cd "$RUNNER_TEMP/extension" && pnpm test:reload
      - name: Verify unified setup, hook and screenshots command
        if: matrix.check == 'setup'
        run: |
          cd "$RUNNER_TEMP/extension"
          git init -b main
          git config user.name 'Test'
          git config user.email 'test@example.invalid'
          env -u CI pnpm run setup
          test -f .git/hooks/pre-commit
          pnpm exec playwright install --with-deps chromium
          pnpm screenshots
          test "$(find reports/screenshots -name '*.png' | wc -l)" -eq 6
          test -n "$(find test-results -name trace.zip -print -quit)"
          test -f playwright-report/index.html
          pnpm check
