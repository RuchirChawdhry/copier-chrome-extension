name: Phase 2 validation
on:
  push:
    branches: [phase-2-productivity]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: copier copy --defaults --vcs-ref=HEAD . .validation/generated
      - name: Format generated project and sync template
        working-directory: .validation/generated
        run: |
          corepack enable
          pnpm run setup
          pnpm fix
          pnpm lint
          python ../../tests/prepare_validation.py
      - name: Commit normalized source and generated CI fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template
          find .validation/generated -name node_modules -prune -o -type f -print0 | xargs -0 git add -f --
          git diff --cached --quiet || git commit -m 'Normalize formatting and capture generated Phase 2 CI fixture'
          git push
      - name: Check generated project
        working-directory: .validation/generated
        run: pnpm check
