name: Generated project — shared CI validation
on:
  push:
    branches: [phase-1-reliability]

permissions:
  contents: read

jobs:
  validate:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/node-ci.yml@f466464ed35ef956bfb4cba15e8c66efc9fb5b69
    with:
      project-path: .validation/generated
      node-version: '22'
      package-manager: pnpm
      build-command: |
        corepack pnpm build
        corepack pnpm verify:build
        corepack pnpm exec playwright install --with-deps chromium
        corepack pnpm exec playwright test
      artifact-path: .validation/generated/dist/
      artifact-name: chromium-extension
