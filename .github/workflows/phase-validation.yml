name: Phase 3 validation
on:
  push:
    branches: [phase-3-browser-capabilities]

permissions:
  contents: read

jobs:
  validate:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/node-ci.yml@a3a3790db090a416409edf543e781652b686c1fb
    with:
      project-path: .validation/generated
      node-version: '22'
      package-manager: pnpm
      build-command: |
        corepack pnpm build
        corepack pnpm verify:build
        corepack pnpm exec playwright install --with-deps chromium
        corepack pnpm exec playwright test
      artifact-path: .validation/generated/dist/
      artifact-name: chromium-extension

      diagnostics-path: |
        .validation/generated/reports/screenshots/
        .validation/generated/test-results/
        .validation/generated/playwright-report/
      diagnostics-name: chromium-diagnostics
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python -m pip install copier
      - run: python -m unittest discover -s tests
  regression:
    strategy:
      fail-fast: false
      matrix:
        check: [features, reload, enabled]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - name: Generate disposable extension
        run: |
          args=()
          if [[ "${{ matrix.check }}" == enabled ]]; then
            args=(-d include_keyboard_shortcuts=true -d include_toolbar_badge=true -d include_optional_permissions=true -d include_content_script=true)
          fi
          copier copy --defaults --vcs-ref=HEAD "${args[@]}" . "$RUNNER_TEMP/extension"
      - name: Install and check
        run: |
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm exec playwright install --with-deps chromium
      - name: Verify feature matrix
        if: matrix.check == 'features'
        run: cd "$RUNNER_TEMP/extension" && node "$GITHUB_WORKSPACE/tests/validate_features.mjs"
      - name: Verify automatic reload
        if: matrix.check == 'reload'
        run: cd "$RUNNER_TEMP/extension" && pnpm test:reload
      - name: Validate fully enabled generated project
        if: matrix.check == 'enabled'
        run: |
          cd "$RUNNER_TEMP/extension"
          pnpm build
          pnpm verify:build
          pnpm exec playwright test
          test "$(find reports/screenshots -name '*.png' | wc -l)" -eq 6
      - name: Upload enabled-capability diagnostics
        if: ${{ always() && matrix.check == 'enabled' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: all-capabilities-diagnostics
          path: |
            ${{ runner.temp }}/extension/reports/screenshots/
            ${{ runner.temp }}/extension/test-results/
            ${{ runner.temp }}/extension/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
