name: Generated project — shared CI validation
on:
  push:
    branches: [phase-1-reliability]

permissions:
  contents: read

jobs:
  validate:
    uses: RuchirChawdhry/ci-workflows/.github/workflows/node-ci.yml@f466464ed35ef956bfb4cba15e8c66efc9fb5b69
    with:
      project-path: .validation/generated
      node-version: '22'
      package-manager: pnpm
      build-command: |
        corepack pnpm build
        corepack pnpm verify:build
        corepack pnpm exec playwright install --with-deps chromium
        corepack pnpm exec playwright test
      artifact-path: .validation/generated/dist/
      artifact-name: chromium-extension
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - run: python -m pip install copier
      - run: python -m unittest discover -s tests
  browser:
    strategy:
      fail-fast: false
      matrix:
        check: [features, hook, reload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
      - name: Install Chromium
        if: matrix.check != 'hook'
        run: cd "$RUNNER_TEMP/extension" && pnpm exec playwright install --with-deps chromium
      - name: Verify feature combinations
        if: matrix.check == 'features'
        run: cd "$RUNNER_TEMP/extension" && node "$GITHUB_WORKSPACE/tests/validate_features.mjs"
      - name: Verify staged Svelte and TypeScript formatting and imports
        if: matrix.check == 'hook'
        run: |
          cd "$RUNNER_TEMP/extension"
          git init -b main
          git config user.name 'Test'
          git config user.email 'test@example.invalid'
          env -u CI pnpm hooks:install
          git add .
          LEFTHOOK=0 git commit -m baseline
          printf "import {removeItem,addItem} from './items';\nexport const operations={addItem,removeItem};\n" > src/core/hook-fixture.ts
          printf '<script lang="ts">let count=$state(0);</script><button type="button" onclick={()=>count++}>{count}</button>\n' > src/ui/hook-fixture.svelte
          git add src/core/hook-fixture.ts src/ui/hook-fixture.svelte
          git commit -m fixture
          git show HEAD:src/core/hook-fixture.ts | grep 'import { addItem, removeItem }'
          git show HEAD:src/ui/hook-fixture.svelte | grep 'let count ='
          pnpm lint
      - name: Verify full reload cycle
        if: matrix.check == 'reload'
        run: cd "$RUNNER_TEMP/extension" && pnpm test:reload
