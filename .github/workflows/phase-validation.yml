
name: Phase 3 final test preparation
on:
  push:
    branches: [phase-3-browser-capabilities]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
      - name: Format and validate updated tests
        run: |
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec biome check --write --max-diagnostics=100 .
          pnpm check
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test states.spec.ts
      - name: Sync formatted template and fixture
        run: |
          cp -r "$RUNNER_TEMP/extension/src/." template/src/
          cp -r "$RUNNER_TEMP/extension/tests/." template/tests/
          cp -r template/src/. .validation/generated/src/
          cp -r template/tests/. .validation/generated/tests/
          cp .validation/next-workflow.yml .github/workflows/phase-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template .github/workflows/phase-validation.yml
          git add -f .validation/generated/src .validation/generated/tests
          git commit -m 'Normalize and validate state regression tests'
          git push
