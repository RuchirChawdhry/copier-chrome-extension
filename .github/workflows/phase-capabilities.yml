name: Phase 5 optional capability validation
on:
  push:
    branches: [phase-5-adaptability]
permissions:
  contents: read
jobs:
  all-capabilities:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: ['false', 'true']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier==9.14.1
      - run: copier copy --defaults --vcs-ref=HEAD -d include_example=${{ matrix.example }} -d include_keyboard_shortcuts=true -d include_toolbar_badge=true -d include_optional_permissions=true -d include_content_script=true . "$RUNNER_TEMP/all-capabilities"
      - name: Check fully enabled generated project
        run: |
          cd "$RUNNER_TEMP/all-capabilities"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          pnpm verify:build
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
          test "$(find reports/screenshots -name '*.png' | wc -l)" -eq 8
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fully-enabled-example-${{ matrix.example }}
          path: |
            ${{ runner.temp }}/all-capabilities/reports/
            ${{ runner.temp }}/all-capabilities/test-results/
            ${{ runner.temp }}/all-capabilities/playwright-report/
          if-no-files-found: ignore
