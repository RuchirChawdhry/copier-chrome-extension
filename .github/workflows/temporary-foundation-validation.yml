name: Temporary foundation validation
on:
  push:
    branches: [foundation-upgrade]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: |
          copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
          cd "$RUNNER_TEMP/extension"
          corepack pnpm install --no-frozen-lockfile
          cp pnpm-lock.yaml "$GITHUB_WORKSPACE/template/pnpm-lock.yaml"
      - name: Normalize existing source formatting with safe Biome fixes
        working-directory: ${{ runner.temp }}/extension
        run: |
          set +e
          corepack pnpm fix
          result=$?
          set -e
          cp -r src scripts tests "$GITHUB_WORKSPACE/template/"
          echo "Biome fix exit: $result (lint checked below)"
      - name: Commit generated lockfile and formatting; remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template/pnpm-lock.yaml template/src template/scripts template/tests
          git rm .github/workflows/temporary-foundation-validation.yml
          git commit -m 'Refresh lockfile and normalize source formatting'
          git push origin HEAD:foundation-upgrade
      - name: Verify generated project
        working-directory: ${{ runner.temp }}/extension
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm lint
          corepack pnpm test
          corepack pnpm build
          corepack pnpm verify:build
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm exec playwright test
      - run: python -m unittest discover -s tests
