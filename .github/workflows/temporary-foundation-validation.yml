name: Temporary foundation validation
on:
  push:
    branches: [foundation-upgrade]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: |
          copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
          cd "$RUNNER_TEMP/extension"
          corepack pnpm install --lockfile-only
          cp pnpm-lock.yaml "$GITHUB_WORKSPACE/template/pnpm-lock.yaml"
      - name: Commit real lockfile and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add template/pnpm-lock.yaml
          git rm .github/workflows/temporary-foundation-validation.yml
          git commit -m 'Generate pnpm dependency lockfile'
          git push origin HEAD:foundation-upgrade
      - name: Verify generated project
        working-directory: ${{ runner.temp }}/extension
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm typecheck
          corepack pnpm lint
          corepack pnpm test
          corepack pnpm build
          corepack pnpm verify:build
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm exec playwright test
      - run: python -m unittest discover -s tests
