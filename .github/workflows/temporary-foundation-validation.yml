name: Temporary foundation validation
on:
  push:
    branches: [foundation-upgrade]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: python -m pip install copier
      - run: |
          copier copy --defaults --vcs-ref=HEAD . "$RUNNER_TEMP/extension"
          cd "$RUNNER_TEMP/extension"
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify typecheck, lint, tests and production build
        working-directory: ${{ runner.temp }}/extension
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm verify:build
      - name: Verify Copier rendering
        run: python -m unittest discover -s tests
      - name: Verify actual Git pre-commit hook
        working-directory: ${{ runner.temp }}/extension
        run: |
          git init -b main
          git config user.name 'Hook test'
          git config user.email 'hook-test@example.invalid'
          CI= pnpm hooks:install
          git add .
          git -c core.hooksPath=/dev/null commit -m 'Initial fixture'
          printf 'export const fixture={value:1};\n' > src/core/hook-fixture.ts
          git add src/core/hook-fixture.ts
          git commit -m 'Exercise pre-commit'
          git show HEAD:src/core/hook-fixture.ts | grep -F 'export const fixture = { value: 1 };'
      - name: Install Chromium
        working-directory: ${{ runner.temp }}/extension
        run: pnpm exec playwright install --with-deps chromium --no-shell
      - name: Verify browser behavior
        working-directory: ${{ runner.temp }}/extension
        run: pnpm exec playwright test
      - name: Verify actual automatic development reload
        working-directory: ${{ runner.temp }}/extension
        run: |
          node --input-type=module <<'JS'
          import { spawn } from 'node:child_process';
          import { readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { chromium } from '@playwright/test';
          const original = await readFile('package.json', 'utf8');
          const dev = spawn(process.execPath, ['scripts/dev.mjs'], {stdio: ['ignore', 'pipe', 'inherit']});
          let context;
          let output = '';
          dev.stdout.on('data', chunk => { output += chunk.toString(); process.stdout.write(chunk); });
          async function until(predicate, message) {
            const deadline = Date.now() + 30_000;
            while (Date.now() < deadline) {
              try { if (await predicate()) return; } catch {}
              await new Promise(r => setTimeout(r, 250));
            }
            throw new Error(message);
          }
          try {
            await until(() => output.includes('Development build ready'), 'Initial dev build did not finish');
            const dist = resolve('dist');
            context = await chromium.launchPersistentContext('', {
              channel: 'chromium', headless: true,
              args: ['--disable-extensions-except=' + dist, '--load-extension=' + dist]
            });
            const worker = context.serviceWorkers()[0] ?? await context.waitForEvent('serviceworker');
            const id = new URL(worker.url()).host;
            const page = await context.newPage();
            await page.goto('chrome-extension://' + id + '/popup.html');
            await page.locator('[data-ready="true"]').waitFor();
            await new Promise(r => setTimeout(r, 1000));
            let closed = false;
            worker.once('close', () => { closed = true; });
            const pkg = JSON.parse(original);
            pkg.extensionName = 'Automatic reload verified';
            await writeFile('package.json', JSON.stringify(pkg, null, 2));
            await until(() => closed, 'Original worker did not close after file change');
            await until(async () => {
              await page.goto('chrome-extension://' + id + '/popup.html');
              return (await page.locator('h1').textContent()) === 'Automatic reload verified';
            }, 'Reloaded extension did not display updated manifest name');
            console.log('Automatic development reload verified in Chromium');
          } finally {
            await context?.close();
            dev.kill('SIGTERM');
            await writeFile('package.json', original);
          }
          JS
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-foundation-validation.yml
          git commit -m 'Remove temporary validation workflow'
          git push origin HEAD:foundation-upgrade
